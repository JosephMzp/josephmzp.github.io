name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:             
    runs-on: ubuntu-latest
    steps: 
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      - name: Lint API (JavaScript)
        run: npx eslint "api/index.js" || true

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

      - name: Armar carpeta del sitio web
        run: |
          mkdir _site
          cp index.html libro-de-visitas.js _site/

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # REEMPLAZAMOS LA DESCARGA DEL ARTEFACTO POR ESTO:
      - name: Armar carpeta del sitio web para pruebas
        run: |
          mkdir _site
          cp index.html libro-de-visitas.js _site/

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas de Vitest
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiquetas (tags) para Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-web
          tags: type=sha,prefix=sha-,format=short

      - name: Construir y subir imagen Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Generar etiquetas (tags) para API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-api
          tags: type=sha,prefix=sha-,format=short

      - name: Construir y subir imagen API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}