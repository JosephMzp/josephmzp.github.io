name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:             
    runs-on: ubuntu-latest
    steps: 
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Lint HTML
        run: npx htmlhint "**/*.html"
      - name: Lint API
        run: npx eslint "api/index.js" || true
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
      - name: Armar carpeta del sitio web
        run: |
          mkdir _site
          cp index.html libro-de-visitas.js _site/
      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js con caché
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Armar carpeta del sitio web para pruebas
        run: |
          mkdir _site
          cp index.html libro-de-visitas.js _site/
      - name: Instalar dependencias
        run: npm ci
      - name: Correr pruebas de Vitest
        run: npm test

  integration-compose:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Crear .env temporal para Compose (Reto 3)
        run: echo "DB_PASSWORD=secreto123" > .env
      - name: Levantar servicios con Compose
        run: docker compose up -d --wait
      - name: Pruebas de contrato de la API
        run: |
          echo "GET /api/health..."
          if [ "$(curl -s -w "%{http_code}" -o /dev/null http://localhost:8080/api/health)" != "200" ]; then exit 1; fi
          echo "POST inválido (sin nombre)..."
          if [ "$(curl -s -X POST http://localhost:8080/api/mensajes -H 'Content-Type: application/json' -d '{"nombre":""}' -w '%{http_code}' -o /dev/null)" != "400" ]; then exit 1; fi
          echo "POST válido..."
          if [ "$(curl -s -X POST http://localhost:8080/api/mensajes -H 'Content-Type: application/json' -d '{"nombre":"Joseph","mensaje":"Prueba"}' -w '%{http_code}' -o /dev/null)" != "201" ]; then exit 1; fi
          echo "GET /api/mensajes..."
          if [[ "$(curl -s http://localhost:8080/api/mensajes)" != *"Prueba"* ]]; then exit 1; fi
      - name: Mostrar logs si algo falla
        if: failure()
        run: docker compose logs

  package:
    needs: [test, integration-compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Iniciar sesión en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar etiquetas Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/josephmzp/perfil-web
          tags: type=sha,prefix=sha-,format=short
      - name: Construir y subir imagen Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
      - name: Generar etiquetas API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/josephmzp/perfil-api
          tags: type=sha,prefix=sha-,format=short
      - name: Construir y subir imagen API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  security:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Obtener SHA corto
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Análisis SAST con Semgrep (Reto 2)
        run: docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --sarif --output semgrep.sarif /src || true
      - name: Subir SAST a Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Generar SARIF de Trivy (Reto 2)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/josephmzp/perfil-api:sha-${{ env.SHORT_SHA }}
          format: 'sarif'
          output: 'trivy.sarif'
          ignore-unfixed: true
      - name: Subir Trivy a Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Escanear imagen Web con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/josephmzp/perfil-web:sha-${{ env.SHORT_SHA }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
      - name: Escanear imagen API con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/josephmzp/perfil-api:sha-${{ env.SHORT_SHA }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  smoke:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Obtener SHA corto
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Iniciar sesión en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar contenedor web
        run: |
          docker run -d -p 8080:8080 --name web --add-host api:127.0.0.1 ghcr.io/josephmzp/perfil-web:sha-${{ env.SHORT_SHA }}
          sleep 5
      - name: Verificar que responde
        run: |
          RESULT=$(curl -s http://localhost:8080/)
          if [[ "$RESULT" != *"Joseph Miguel Zavaleta Polo"* ]]; then exit 1; fi

  deploy-prod:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Revisar producción (Reto 5)
        run: |
          sleep 10
          RESULT=$(curl -s ${{ steps.deployment.outputs.page_url }})
          if [[ "$RESULT" != *"Joseph Miguel Zavaleta Polo"* ]]; then exit 1; fi