name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:             
    runs-on: ubuntu-latest
    steps: 
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      - name: Lint API (JavaScript)
        run: npx eslint "api/index.js" || true

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

      - name: Armar carpeta del sitio web
        run: |
          mkdir _site
          cp index.html libro-de-visitas.js _site/

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar artefacto del sitio web
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas de Vitest
        run: npm test